<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AudioGraphics Login</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0f; --fg: #f4f4f6; --muted: #9a9aa6; --accent: #1ed760; --panel: #17171f; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  #code { background: var(--panel); border-radius: 14px; padding: 16px; font: 14px/1.4 ui-monospace, Menlo, monospace;
          word-break: break-all; user-select: all; -webkit-user-select: all; margin-bottom: 16px; }
  button { width: 100%; border: 0; border-radius: 999px; padding: 16px; font: 600 18px/1 inherit;
           background: var(--accent); color: #000; cursor: pointer; }
  ol { color: var(--muted); padding-left: 20px; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
<main>
  <div id="ok" hidden>
    <h1>Almost there</h1>
    <p>Copy this code, then paste it into the text field on your Apple TV.</p>
    <div id="code"></div>
    <button id="copy" type="button">Copy code</button>
    <ol>
      <li>On the Apple TV, select the <b>Paste code</b> field.</li>
      <li>Tap the Apple TV keyboard notification on this phone.</li>
      <li>Paste, then tap Done.</li>
    </ol>
  </div>
  <div id="fail" hidden>
    <h1>Login didn't finish</h1>
    <p class="error" id="reason"></p>
    <p>Scan the QR code on your TV to try again.</p>
  </div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get("code");

  // The TV puts its helper's relay URL in `state`; only forward to a home-network address.
  function relayURL(state) {
    try {
      const url = new URL(state);
      const privateHost = /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(url.hostname) || url.hostname.endsWith(".local");
      return url.protocol === "http:" && privateHost && url.pathname === "/auth/callback" ? url : null;
    } catch {
      return null;
    }
  }
  const relay = code && relayURL(params.get("state") || "");
  if (relay) {
    relay.searchParams.set("code", code);
    location.replace(relay.href);
  }

  if (code) {
    document.getElementById("ok").hidden = false;
    document.getElementById("code").textContent = code;
    const button = document.getElementById("copy");
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(code);
        button.textContent = "Copied ✓";
      } catch {
        getSelection().selectAllChildren(document.getElementById("code"));
        button.textContent = "Select and copy the code above";
      }
    });
  } else {
    document.getElementById("fail").hidden = false;
    document.getElementById("reason").textContent = params.get("error") || "No login code was returned.";
  }
</script>
</body>
</html>
